:root{
  /* Layout: one screen without scrolling. A quiet top strip, a stage that swaps three views,
     and a dock of six destinations at hand height. Hairline isometric drawings carry the page;
     coral marks only what is selected or being touched. Single light theme by choice. */
  --paper:#ffffff;
  --ink:#15151a;
  --edge:#6b6b76;
  --mid:#a7a7b2;
  --lo:#e2e2e8;
  --accent:#ff5a43;
  --y1:#8f86ff; --y2:#f6f600; --y3:#7dfbae;
  --head:"Tecna","Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --display:"Aptos","Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pad:2.2rem;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;font-size:clamp(13px,min(1.02vw,1.8vh),46px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:1rem;line-height:1.35;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--edge);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* top strip */
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.3rem var(--pad) .9rem}
.brand{display:flex;align-items:baseline;gap:1rem}
.brand h1{font-family:var(--head);font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.top-r{display:flex;align-items:center;gap:1.2rem}
.wordmark{height:2.3rem;width:auto;display:block}
.icon{width:2.8rem;height:2.8rem;display:grid;place-items:center;border:1px solid var(--lo);border-radius:.7rem}
.icon svg{width:1.15rem;height:1.15rem;fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.icon:active{border-color:var(--ink)}

/* views */
main{position:relative;min-height:0}
.view{position:absolute;inset:0;padding:.4rem var(--pad) 1.2rem;display:grid;gap:2.2rem;opacity:0;visibility:hidden;
  transform:translateY(.6rem);transition:opacity .35s ease,transform .45s cubic-bezier(.5,0,.1,1),visibility 0s .35s;overflow:auto}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease .08s,transform .5s cubic-bezier(.5,0,.1,1) .08s}
.fig{position:relative;min-height:0;min-width:0}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fig.touch{touch-action:none;cursor:crosshair}
.readout{color:var(--ink)}

/* start */
#v-start{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.stage{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0}
.stage-head{position:relative;z-index:1;pointer-events:none}
.verb{font-family:var(--head);font-weight:900;font-size:6.6rem;line-height:.95;letter-spacing:-.02em;margin:.3rem 0 .7rem -.2rem}
.verb-line{font-size:1.25rem;color:var(--edge);max-width:22ch}
.verb,.verb-line{transition:opacity .25s ease}
.swap .verb,.swap .verb-line{opacity:0}
.stage>.fig{position:absolute;inset:6.5rem 0 6.2rem 10%}
.stage-foot{grid-row:3;display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;position:relative;z-index:1;pointer-events:none}
.hint{display:flex;align-items:center;gap:.6rem}
.hint::before{content:"";width:.5rem;height:.5rem;border-radius:50%;border:1px solid var(--accent);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,90,67,.5)}70%,100%{box-shadow:0 0 0 .7rem rgba(255,90,67,0)}}
.verbs{grid-row:4;display:grid;grid-template-columns:repeat(6,auto);justify-content:space-between;border-top:1px solid var(--lo);position:relative;z-index:1}
.verbs button{padding:.95rem .2rem .3rem;font-family:var(--head);font-weight:300;font-size:1.25rem;color:var(--mid);position:relative;min-height:3.4rem;min-width:4.5rem}
.verbs button::before{content:"";position:absolute;left:0;top:-1px;width:0;height:2px;background:var(--accent);transition:width .35s cubic-bezier(.5,0,.1,1)}
.verbs button[aria-selected="true"]{color:var(--ink);font-weight:900}
.verbs button[aria-selected="true"]::before{width:2.4rem}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1rem;min-height:0}
.tile{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;border:1px solid var(--lo);border-radius:1.3rem;padding:1rem 1.3rem 1.15rem;
  transition:border-color .2s ease,transform .2s ease;min-height:11rem}
.tile:active{border-color:var(--ink);transform:scale(.985)}
.tile h3{font-family:var(--head);font-size:1.5rem;font-weight:900;letter-spacing:-.01em;line-height:1.1;margin-bottom:.35rem;text-wrap:balance;padding-right:2.6rem}
.tile .go{position:absolute;right:1.2rem;bottom:1.1rem;width:2.3rem;height:2.3rem;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.go svg{width:1rem;height:1rem;fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* opleiding */
#v-prog{grid-template-columns:minmax(0,1.2fr) minmax(0,.92fr) minmax(0,1fr)}
.col{display:grid;min-height:0;min-width:0}
.p-fig{grid-template-rows:auto minmax(0,1fr) auto}
.p-fig h2{font-family:var(--head);font-size:2.9rem;font-weight:900;letter-spacing:-.02em;line-height:1;margin:.35rem 0 .7rem;text-wrap:balance}
.p-fig .line{font-size:1.2rem;color:var(--edge);max-width:34ch;text-wrap:pretty}
.p-foot{display:flex;justify-content:space-between;padding-top:.5rem}
.col-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--head);font-size:1.3rem;font-weight:700;letter-spacing:0;padding-bottom:.7rem;border-bottom:1px solid var(--ink)}
.p-vak{grid-template-rows:auto minmax(0,1fr) auto}
.vaklist{overflow:auto;min-height:0;transition:opacity .22s ease}
.vaklist.swap,.vakinfo.swap{opacity:0}
.vakinfo{transition:opacity .22s ease}
.vaklist.dense .vak{padding:.44rem 0;min-height:2.55rem}
.vak .tag{margin-left:auto;padding:.12rem .45rem;border:1px solid var(--lo);border-radius:.4rem;font-size:.66rem;color:var(--edge);font-weight:400}
.vak[aria-pressed="true"] .tag{border-color:var(--ink);color:var(--ink)}
.stage-card{display:grid;gap:.9rem;align-content:start;padding:1.6rem 0 0}
.stage-card .chip{width:3.2rem;height:3.2rem;border-radius:.7rem;display:grid;place-items:center;background:var(--y3);font-family:var(--mono);font-size:1.3rem;font-weight:500}
.stage-card h4{margin:0;font-family:var(--head);font-size:2.3rem;font-weight:900;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.stage-card p{font-size:1.2rem;color:var(--edge);max-width:34ch;text-wrap:pretty}
.vak{display:flex;align-items:center;gap:.8rem;width:100%;padding:.62rem 0;border-bottom:1px solid var(--lo);font-family:var(--head);font-size:1.25rem;font-weight:400;letter-spacing:0;color:var(--edge);min-height:2.9rem;transition:color .2s ease,padding .3s cubic-bezier(.5,0,.1,1)}
.vak::before{content:"";flex:none;width:0;height:2px;background:var(--accent);transition:width .3s cubic-bezier(.5,0,.1,1)}
.vak[aria-pressed="true"]{color:var(--ink);font-weight:700}
.vak[aria-pressed="true"]::before{width:1.4rem}
.vakinfo{min-height:5.6rem;padding-top:.9rem}
.vakinfo .mono{display:block;margin-bottom:.3rem}
.vakinfo p{font-size:1.2rem;text-wrap:pretty;max-width:36ch}
.p-str{grid-template-rows:auto minmax(0,1fr) auto}
.years{display:grid;gap:.5rem}
.year{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;width:100%;padding:.65rem .9rem .65rem .65rem;border:1px solid var(--lo);border-radius:.9rem;transition:border-color .2s ease;min-height:3.8rem}
.year[aria-pressed="true"]{border-color:var(--ink)}
.year .chip{width:2.5rem;height:2.5rem;border-radius:.55rem;display:grid;place-items:center;font-family:var(--mono);font-size:1.05rem;font-weight:500;color:var(--ink)}
.year:nth-child(1) .chip{background:var(--y1)} .year:nth-child(2) .chip{background:var(--y2)} .year:nth-child(3) .chip{background:var(--y3)}
.year b{display:block;font-family:var(--head);font-size:1.2rem;font-weight:600;line-height:1.15}

/* kernwaarden */
#v-waarden{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.w-txt{grid-template-rows:auto auto auto;align-content:center;gap:.7rem}
.value{font-family:var(--head);font-size:3.8rem;font-weight:800;letter-spacing:-.02em;line-height:1.04;text-wrap:balance;transition:opacity .25s ease;min-height:3.06em;margin-bottom:1.4rem}
.value.swap{opacity:0}
.vals{border-top:1px solid var(--ink)}
.val{display:flex;align-items:baseline;gap:.9rem;width:100%;padding:.6rem 0;border-bottom:1px solid var(--lo);font-size:1.2rem;font-weight:500;color:var(--edge);min-height:2.8rem}
.val::before{content:"";flex:none;align-self:center;width:0;height:2px;background:var(--accent);transition:width .3s cubic-bezier(.5,0,.1,1)}
.val[aria-pressed="true"]{color:var(--ink);font-weight:600}
.val[aria-pressed="true"]::before{width:1.4rem}
.val .mono{color:inherit}

/* dock */
.dock{display:flex;gap:.6rem;padding:.9rem var(--pad) 1.3rem;border-top:1px solid var(--lo);overflow-x:auto}
.dock button{flex:1 1 0;min-width:max-content;min-height:3.7rem;padding:.6rem 1.1rem;border:1px solid var(--lo);border-radius:.95rem;font-size:1.1rem;font-weight:500;
  display:flex;align-items:center;gap:.6rem;color:var(--edge);transition:border-color .2s ease,color .2s ease}
.dock button::before{content:"";flex:none;width:.45rem;height:.45rem;border-radius:50%;border:1px solid var(--mid)}
.dock button[aria-current="page"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.dock button[aria-current="page"]::before{border-color:var(--accent);background:var(--accent)}
.dock button:active{border-color:var(--ink)}

/* portrait screens and tablets */
@media (max-aspect-ratio:1/1){
  html{font-size:clamp(13px,min(1.95vw,1.08vh),46px)}
  #v-start{grid-template-columns:1fr;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr)}
  #v-prog{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,.8fr) minmax(0,1fr)}
  #v-prog .p-fig{grid-column:1/-1}
  #v-waarden{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .dock{flex-wrap:wrap}
  .dock button{flex:1 1 30%}
}
/* phones */
@media (max-width:640px){
  :root{--pad:1rem}
  .brand .mono,.hint{display:none}
  .view{display:block}
  .view>*{margin-bottom:1.6rem}
  .stage{height:34rem}
  .stage>.fig{inset:7rem 0 9rem 0}
  .verb{font-size:5rem}
  .verbs{grid-template-columns:repeat(3,minmax(0,1fr));justify-content:normal}
  .verbs button{font-size:1.2rem;padding:.7rem .2rem .2rem;min-height:2.8rem}
  .tiles{grid-template-columns:1fr;grid-template-rows:none}
  .tile{grid-template-rows:10rem auto}
  .p-fig{height:27rem}
  .p-fig h2{font-size:2.1rem}
  .p-str .fig{height:17rem}
  .w-fig{height:21rem}
  .value{font-size:2.3rem}
  .dock{flex-wrap:nowrap}
  .dock button{flex:none}
}
@media (prefers-reduced-motion:reduce){
  .view,.verb,.verb-line,.value{transition:none}
  .hint::before{animation:none}
}
</style>

F.io = { span: 9, zc: 1.6, floor: 5.2, draw(g, s) {

// IMMERSIEF TECHNICUS: dezelfde ruimte, met truss, twee boxen en drie spots die bij aanraking één lichtcirkel vormen
F.it = { span: 9, zc: 1.6, floor: 5.2, draw(g, s) {

  hub.s.sel = i;
  const el = $('value'), apply = () => { el.textContent = VALUES[i]; el.classList.remove('swap'); };
  if (user === 'init' || RM) apply(); else { el.classList.add('swap'); setTimeout(apply, 200); }
  $('val-n').textContent = '· ' + (i + 1) + ' / ' + VALUES.length;
  document.querySelectorAll('.val').forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
}
function setProg(i) {
  const p = PROGS[i]; st.prog = i;
  $('p-name').textContent = p.name; $('p-line').textContent = p.line;
  pfig.setDef(F[p.fig]);
  st.vak = 0; cur = { list: [] }; setYear(0); renderVakken(false);
}
function go(view, prog, silent) {
  if (view === 'prog') setProg(prog == null ? st.prog : prog);
  st.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  document.querySelectorAll('#dock button').forEach(b => {
    const cur = view === 'prog' ? b.dataset.prog != null && +b.dataset.prog === st.prog : b.dataset.view === view;
    if (cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (!silent) { const name = view === 'prog' ? PROGS[st.prog].id : view === 'waarden' ? 'kernwaarden' : ''; try { history.replaceState(null, '', name ? '#' + name : location.pathname + location.search); } catch (e) {} }
}
function fromHash() {
  const h = location.hash.slice(1), i = PROGS.findIndex(p => p.id === h);
  if (i >= 0) go('prog', i, true); else if (h === 'kernwaarden') go('waarden', null, true); else go('start', null, true);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.verb != null) setVerb(+d.verb, true);
  else if (d.vak != null) { setVak(+d.vak); yearUser = performance.now(); }
  else if (d.year != null) setYear(+d.year, true);
  else if (d.val != null) setVal(+d.val, true);
  else if (d.prog != null) go('prog', +d.prog);
  else if (d.view) go(d.view);
  else if (b.id === 'fs') { try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (err) {} }
});
document.addEventListener('pointerdown', () => { lastTouch = performance.now(); }, true);
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('hashchange', fromHash);

// rustmodus: na een tijdje zonder aanraking terug naar start, en vanzelf doorlopen
const IDLE = 90000, HOLD = 16000;
setInterval(() => {
  const now = performance.now();
  if (RM) return;
  if (now - lastTouch > IDLE && st.view !== 'start') { go('start'); verbUser = -1e9; }
  if (st.view === 'start' && now - verbUser > HOLD && now - verbAt > 7500) setVerb((st.verb + 1) % VERBS.length);
  if (st.view === 'prog' && now - yearUser > HOLD && now - yearAt > (PROGS[st.prog].jaren ? 8000 : 3600)) setYear((st.year + 1) % 3);
  if (st.view === 'waarden' && now - valUser > HOLD && now - valAt > 4200) setVal((st.val + 1) % VALUES.length);
}, 500);

let prev = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - prev) / 1000); prev = now;
  for (const f of figs) if (f.view === st.view) f.frame(now, dt);
  requestAnimationFrame(loop);
}

function start(saved) {
  Object.assign(st, saved && saved.view ? saved : {});
  setVerb(st.verb, 'init'); setProg(st.prog); setYear(st.year); setVal(st.val, 'init');
  if (saved && saved.view) { go(st.view, st.prog, true); if (st.view === 'prog') { setYear(saved.year || 0); renderVakken(false); setVak(saved.vak || 0); } }
  else fromHash();
  requestAnimationFrame(loop);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ ...st }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
